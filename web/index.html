<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Apps & Tools · DAW 1</title>
  <meta name="description" content="Guía de herramientas, IDEs y software para estudiantes de 1.º de DAW, con alternativas para Windows, macOS y Linux.">
  <link rel="icon" type="image/jpeg" href="./logo.jpg">
  <link rel="shortcut icon" type="image/jpeg" href="./logo.jpg">
  <link rel="apple-touch-icon" href="./logo.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Instrument+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./assets/styles.css">
  <script>
    /* Aplica el tema guardado (o la preferencia del sistema) antes de pintar, para evitar parpadeos. */
    (function () {
      var t;
      try { t = localStorage.getItem('theme'); } catch (e) { t = null; }
      if (t !== 'light' && t !== 'dark') {
        t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
</head>
<body>
  <a class="skip" href="#app">Saltar al contenido</a>

  <header class="topbar">
    <button class="btn-menu" id="navToggle" type="button" aria-controls="sidebar" aria-expanded="false">Menú</button>
    <a class="brand" href="#/"><img src="./logo.jpg" alt="" class="brand-logo" loading="lazy"><span class="brand-name">Apps &amp; Tools</span></a>
    <button class="btn-theme" type="button" data-theme-toggle aria-label="Cambiar a tema oscuro" title="Cambiar a tema oscuro">
      <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.2 5.2l1.4 1.4M17.4 17.4l1.4 1.4M18.8 5.2l-1.4 1.4M6.6 17.4l-1.4 1.4"/></svg>
      <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 13.2A8.5 8.5 0 1 1 10.8 3.5a6.8 6.8 0 0 0 9.7 9.7Z"/></svg>
    </button>
  </header>

  <div class="shell">
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#/">
        <img src="./logo.jpg" alt="" class="brand-logo" loading="lazy">
        <span class="brand-name">Apps &amp; Tools</span>
        <span class="brand-sub" id="brandSub"></span>
      </a>
      <nav aria-label="Asignaturas"><ul class="nav" id="nav"></ul></nav>
      <div class="side-foot">
        <p>
          <a data-repo="" target="_blank" rel="noopener">Repositorio en GitHub</a><br>
          <a data-repo="/issues/new" target="_blank" rel="noopener">Proponer una herramienta</a>
        </p>
        <button class="btn-theme" type="button" data-theme-toggle aria-label="Cambiar a tema oscuro" title="Cambiar a tema oscuro">
          <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.2 5.2l1.4 1.4M17.4 17.4l1.4 1.4M18.8 5.2l-1.4 1.4M6.6 17.4l-1.4 1.4"/></svg>
          <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 13.2A8.5 8.5 0 1 1 10.8 3.5a6.8 6.8 0 0 0 9.7 9.7Z"/></svg>
        </button>
      </div>
    </aside>
    <div class="scrim" id="scrim"></div>

    <div class="content">
      <div class="toolbar" role="search">
        <div class="field">
          <label for="q">Buscar</label>
          <input id="q" type="search" placeholder="VirtualBox, IA, Linux…" autocomplete="off">
        </div>
        <div class="field">
          <span class="field-label" id="osLabel">Mi sistema</span>
          <div class="seg" id="os" role="group" aria-labelledby="osLabel"></div>
        </div>
      </div>

      <main id="app" tabindex="-1">
        <noscript><p class="notice">Esta página necesita JavaScript para mostrar las herramientas.</p></noscript>
      </main>

      <footer class="foot">
        Proyecto independiente creado con fines de aprendizaje y de posible ayuda
      </footer>
    </div>
  </div>

  <!-- 1) configuración, 2) una línea por asignatura, 3) la app. Para añadir una asignatura: crea su archivo en data/ y añade aquí su <script>. -->
  <script src="./data/site.js" defer></script>
  <script src="./data/sistemas-informaticos.js" defer></script>
  <script src="./data/programacion.js" defer></script>
  <script src="./data/ia.js" defer></script>
  <script src="./data/extras.js" defer></script>
  <script src="./data/pendientes.js" defer></script>
  <script src="./assets/app.js" defer></script>
</body>
</html>
